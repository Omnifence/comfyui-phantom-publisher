[project]
name = "comfyui-phantom-publisher"
description = "Publish exact ComfyUI workflows and dependencies to Phantom Router"
version = "0.4.0"
license = { file = "LICENSE" }
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["aiohttp>=3.9"]

[project.urls]
Repository = "https://github.com/EvershieldAI/comfyui-phantom-publisher"
Documentation = "https://docs.phantomrouter.ai"

[tool.comfy]
PublisherId = "phantom"
DisplayName = "Phantom Publisher"
Icon = "https://docs.phantomrouter.ai/img/logo.svg"
